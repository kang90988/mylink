<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이링크 (MyLink)</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
        h1 { color: #333; }
        a { display: block; margin: 15px auto; padding: 12px 20px; width: 250px; background: #007bff; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        a:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>강대화의 마이링크</h1>
    <p>자주 사용하는 링크 모음입니다.</p>
    <a href="https://github.com" target="_blank">나의 GitHub</a>
    <a href="https://www.google.com" target="_blank">구글 바로가기</a>
</body>
</html>
